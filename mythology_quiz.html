<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그리스 신화 퀴즈</title>
<style>
  :root {
    --primary: #3F51B5;
    --dark-bg: #0D1B6E;
    --accent: #FFD700;
    --correct: #2E7D32;
    --wrong: #C62828;
    --text: #FFFFFF;
    --card: rgba(255,255,255,0.1);
    --card-border: rgba(255,255,255,0.2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0D1B6E 0%, #1a237e 50%, #283593 100%);
    min-height: 100vh;
    color: var(--text);
  }
  .screen { display: none; min-height: 100vh; padding: 20px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }

  /* ===== BGM BUTTON ===== */
  #bgm-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    background: rgba(255,215,0,0.15);
    border: 2px solid rgba(255,215,0,0.5);
    color: var(--accent);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
    backdrop-filter: blur(6px);
  }
  #bgm-btn:hover { background: rgba(255,215,0,0.28); transform: scale(1.1); }
  #bgm-btn.playing { border-color: var(--accent); background: rgba(255,215,0,0.25); }
  @keyframes spin-note {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  #bgm-btn.playing .note-icon { display: inline-block; animation: spin-note 3s linear infinite; }

  /* ===== HOME ===== */
  #home {
    justify-content: center;
    gap: 24px;
    text-align: center;
  }
  .mascot {
    font-size: 80px;
    animation: bounce 2s infinite;
    display: block;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  .title { font-size: 28px; font-weight: bold; color: var(--accent); text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .subtitle { font-size: 14px; opacity: 0.8; }
  .btn-home {
    width: 280px;
    padding: 16px 24px;
    border: none;
    border-radius: 16px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }
  .btn-home:active { transform: scale(0.93); }
  .btn-quiz { background: linear-gradient(135deg, #FFD700, #FFA000); color: #1a1a1a; }
  .btn-search { background: linear-gradient(135deg, #42A5F5, #1565C0); color: white; }
  .btn-gallery { background: linear-gradient(135deg, #66BB6A, #2E7D32); color: white; }

  /* ===== COMMON ===== */
  .header {
    width: 100%;
    max-width: 600px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .back-btn {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: white;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.2); }
  .screen-title { font-size: 20px; font-weight: bold; color: var(--accent); }

  /* ===== DIFFICULTY ===== */
  #difficulty { justify-content: center; gap: 20px; text-align: center; }
  .diff-title { font-size: 24px; font-weight: bold; color: var(--accent); margin-bottom: 8px; }
  .diff-card {
    width: 280px;
    padding: 20px;
    border-radius: 16px;
    border: 2px solid var(--card-border);
    cursor: pointer;
    transition: transform 0.15s, border-color 0.2s;
    background: var(--card);
  }
  .diff-card:hover { transform: scale(1.03); border-color: var(--accent); }
  .diff-emoji { font-size: 36px; }
  .diff-name { font-size: 20px; font-weight: bold; margin: 8px 0 4px; }
  .diff-desc { font-size: 13px; opacity: 0.8; }

  /* ===== QUIZ ===== */
  #quiz { justify-content: flex-start; align-items: center; gap: 16px; }
  .quiz-header {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .progress-text { font-size: 14px; opacity: 0.8; }
  .timer-box {
    background: var(--card);
    border: 2px solid var(--card-border);
    border-radius: 12px;
    padding: 6px 14px;
    font-size: 18px;
    font-weight: bold;
    min-width: 52px;
    text-align: center;
    transition: color 0.3s, border-color 0.3s;
  }
  .timer-box.warn { color: var(--wrong); border-color: var(--wrong); }
  .progress-bar-wrap {
    width: 100%;
    max-width: 600px;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 6px;
    transition: width 0.4s;
  }
  .question-card {
    width: 100%;
    max-width: 600px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 24px;
    text-align: center;
  }
  .question-emoji { font-size: 56px; margin-bottom: 12px; display: block; }
  .question-hint { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .question-text { font-size: 17px; line-height: 1.5; }
  .options-grid {
    width: 100%;
    max-width: 600px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .option-btn {
    padding: 16px 12px;
    border-radius: 14px;
    border: 2px solid var(--card-border);
    background: var(--card);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s, border-color 0.2s;
    line-height: 1.3;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(255,215,0,0.15); }
  .option-btn.correct { background: var(--correct); border-color: #4CAF50; transform: scale(1.05); }
  .option-btn.wrong { background: var(--wrong); border-color: #EF5350; }
  .option-btn.reveal { background: rgba(46,125,50,0.4); border-color: #4CAF50; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s; }
  .score-display {
    font-size: 14px;
    opacity: 0.8;
    align-self: flex-end;
    margin-right: 0;
    max-width: 600px;
    width: 100%;
    text-align: right;
  }

  /* ===== RESULT ===== */
  #result { justify-content: center; gap: 20px; text-align: center; }
  .result-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
  }
  .grade-badge {
    font-size: 72px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(255,215,0,0.6);
    display: block;
    animation: popIn 0.6s cubic-bezier(0.68,-0.55,0.265,1.55);
  }
  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .grade-msg { font-size: 18px; font-weight: bold; margin: 12px 0 20px; }
  .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
  .stat-label { opacity: 0.7; }
  .stat-val { font-weight: bold; color: var(--accent); }
  .result-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 380px; }
  .btn-result {
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .btn-result:active { transform: scale(0.93); }
  .btn-again { background: linear-gradient(135deg, #FFD700, #FFA000); color: #1a1a1a; }
  .btn-gallery2 { background: linear-gradient(135deg, #66BB6A, #2E7D32); color: white; }
  .btn-home2 { background: var(--card); color: white; border: 1px solid var(--card-border); }
  .confetti-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
  .confetti-piece {
    position: absolute;
    top: -40px;
    font-size: 22px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ===== SEARCH ===== */
  #search { justify-content: flex-start; align-items: center; gap: 12px; }
  .search-input-wrap {
    width: 100%;
    max-width: 600px;
    position: relative;
  }
  .search-input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.12);
    color: white;
    font-size: 16px;
    outline: none;
  }
  .search-input::placeholder { color: rgba(255,255,255,0.5); }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; }
  .chip-wrap {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: white;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .chip.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: bold; }
  .result-count { font-size: 13px; opacity: 0.7; align-self: flex-start; max-width: 600px; width: 100%; }
  .char-grid {
    width: 100%;
    max-width: 600px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .char-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.2s;
    text-align: center;
  }
  .char-card:hover { transform: scale(1.03); border-color: var(--accent); }
  .char-emoji { font-size: 36px; margin-bottom: 6px; display: block; }
  .char-name { font-size: 15px; font-weight: bold; }
  .char-greek { font-size: 12px; opacity: 0.6; }
  .char-cat { font-size: 11px; background: rgba(255,215,0,0.2); color: var(--accent); border-radius: 8px; padding: 2px 8px; display: inline-block; margin-top: 4px; }
  .empty-msg { text-align: center; opacity: 0.5; font-size: 16px; padding: 40px; }

  /* ===== GALLERY ===== */
  #gallery { justify-content: flex-start; align-items: center; gap: 12px; }
  .progress-info { width: 100%; max-width: 600px; text-align: center; }
  .progress-label { font-size: 14px; opacity: 0.7; margin-bottom: 6px; }
  .gallery-grid {
    width: 100%;
    max-width: 600px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .gallery-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px 8px;
    cursor: pointer;
    transition: transform 0.15s;
    text-align: center;
    position: relative;
  }
  .gallery-card.locked { opacity: 0.4; cursor: default; }
  .gallery-card:not(.locked):hover { transform: scale(1.05); border-color: var(--accent); }
  .lock-overlay { position: absolute; top: 6px; right: 6px; font-size: 14px; }
  .gallery-emoji { font-size: 28px; }
  .gallery-name { font-size: 12px; font-weight: bold; margin-top: 4px; }

  /* ===== DETAIL ===== */
  #detail { justify-content: flex-start; align-items: center; gap: 16px; }
  .detail-card {
    width: 100%;
    max-width: 600px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
  }
  .detail-emoji { font-size: 72px; display: block; margin-bottom: 12px; }
  .detail-korean { font-size: 28px; font-weight: 900; color: var(--accent); }
  .detail-greek { font-size: 16px; opacity: 0.7; margin-bottom: 8px; }
  .detail-cat { display: inline-block; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.4); color: var(--accent); padding: 4px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 16px; }
  .detail-desc { font-size: 15px; line-height: 1.7; text-align: left; margin-bottom: 16px; opacity: 0.9; }
  .detail-attrs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
  .attr-chip { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 4px 10px; font-size: 12px; }
  .diff-stars { font-size: 20px; color: var(--accent); }

  /* ===== RESPONSIVE ===== */
  @media(max-width: 480px) {
    .options-grid { grid-template-columns: 1fr; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .char-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <span class="mascot">⚡</span>
  <div>
    <div class="title">그리스 신화 퀴즈</div>
    <div class="subtitle">신화 속 영웅들의 이야기를 배워보세요</div>
  </div>
  <button class="btn-home btn-quiz" onclick="showDifficulty()">🎯 신화 퀴즈 시작</button>
  <button class="btn-home btn-search" onclick="showSearch()">🔍 신화 인물 검색</button>
  <button class="btn-home btn-gallery" onclick="showGallery()">🎨 캐릭터 도감</button>
</div>

<!-- DIFFICULTY -->
<div id="difficulty" class="screen">
  <div class="diff-title">⚡ 난이도 선택</div>
  <div class="subtitle">퀴즈 난이도를 선택하세요</div>
  <div class="diff-card" onclick="startQuiz('easy')">
    <div class="diff-emoji">😊</div>
    <div class="diff-name">쉬움</div>
    <div class="diff-desc">올림포스 12신 위주 • 10점+5점</div>
  </div>
  <div class="diff-card" onclick="startQuiz('normal')">
    <div class="diff-emoji">🎯</div>
    <div class="diff-name">보통</div>
    <div class="diff-desc">전체 인물 • 10점+10점</div>
  </div>
  <div class="diff-card" onclick="startQuiz('hard')">
    <div class="diff-emoji">💀</div>
    <div class="diff-name">어려움</div>
    <div class="diff-desc">고급 인물 위주 • 10점+15점</div>
  </div>
  <button class="back-btn" onclick="showHome()">← 홈으로</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <span class="progress-text" id="q-progress">1 / 10</span>
    <div class="timer-box" id="timer">20</div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="q-bar" style="width:10%"></div>
  </div>
  <div class="question-card">
    <span class="question-emoji" id="q-emoji">⚡</span>
    <div class="question-hint">이 인물은 누구일까요?</div>
    <div class="question-text" id="q-text">힌트가 여기 나옵니다</div>
  </div>
  <div class="options-grid" id="options"></div>
  <div class="score-display" id="q-score">점수: 0</div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="confetti-wrap" id="confetti"></div>
  <div class="result-card">
    <span class="grade-badge" id="r-grade">S</span>
    <div class="grade-msg" id="r-msg">완벽해요!</div>
    <div class="stat-row"><span class="stat-label">점수</span><span class="stat-val" id="r-score">0</span></div>
    <div class="stat-row"><span class="stat-label">정답</span><span class="stat-val" id="r-correct">0 / 10</span></div>
    <div class="stat-row"><span class="stat-label">정답률</span><span class="stat-val" id="r-pct">0%</span></div>
  </div>
  <div class="result-btns">
    <button class="btn-result btn-again" onclick="showDifficulty()">🔄 다시 도전</button>
    <button class="btn-result btn-gallery2" onclick="showGallery()">🎨 도감 보기</button>
    <button class="btn-result btn-home2" onclick="showHome()">🏠 홈</button>
  </div>
</div>

<!-- SEARCH -->
<div id="search" class="screen">
  <div class="header">
    <button class="back-btn" onclick="showHome()">←</button>
    <span class="screen-title">🔍 인물 검색</span>
  </div>
  <div class="search-input-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search-input" type="text" placeholder="이름으로 검색..." oninput="filterChars()" />
  </div>
  <div class="chip-wrap" id="cat-chips"></div>
  <div class="result-count" id="search-count"></div>
  <div class="char-grid" id="search-grid"></div>
</div>

<!-- GALLERY -->
<div id="gallery" class="screen">
  <div class="header">
    <button class="back-btn" onclick="showHome()">←</button>
    <span class="screen-title">🎨 캐릭터 도감</span>
  </div>
  <div class="progress-info">
    <div class="progress-label" id="gal-label">해금 0 / 35</div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="gal-bar" style="width:0%"></div></div>
  </div>
  <div class="gallery-grid" id="gallery-grid"></div>
</div>

<!-- DETAIL -->
<div id="detail" class="screen">
  <div class="header">
    <button class="back-btn" id="detail-back">←</button>
    <span class="screen-title">캐릭터 정보</span>
  </div>
  <div class="detail-card">
    <span class="detail-emoji" id="d-emoji"></span>
    <div class="detail-korean" id="d-korean"></div>
    <div class="detail-greek" id="d-greek"></div>
    <span class="detail-cat" id="d-cat"></span>
    <div class="detail-desc" id="d-desc"></div>
    <div class="detail-attrs" id="d-attrs"></div>
    <div class="diff-stars" id="d-diff"></div>
  </div>
</div>

<!-- BGM Toggle Button -->
<button id="bgm-btn" onclick="toggleBGM()" title="배경음악 켜기/끄기">
  <span class="note-icon">🎵</span>
</button>

<script>
// ===== DATA =====
const CHARACTERS = [
  { nameKorean:"제우스", nameGreek:"Zeus", category:"올림포스 12신", description:"올림포스의 주신으로 신들의 왕. 하늘과 번개를 다스리며, 독수리와 번개가 상징이다. 크로노스와 레아의 아들로 티탄 전쟁에서 승리해 우주의 지배자가 됐다.", shortHint:"번개를 무기로 사용하는 신들의 왕", attributes:"번개, 독수리, 왕관, 올림포스", emoji:"⚡", difficulty:1 },
  { nameKorean:"헤라", nameGreek:"Hera", category:"올림포스 12신", description:"결혼과 가정의 여신이자 제우스의 아내. 공작과 소가 상징이며, 질투심이 강하기로 유명하다. 제우스의 수많은 연인들과 그 자녀들을 박해했다.", shortHint:"결혼의 여신이자 제우스의 아내", attributes:"공작, 결혼, 질투, 왕비", emoji:"👑", difficulty:1 },
  { nameKorean:"포세이돈", nameGreek:"Poseidon", category:"올림포스 12신", description:"바다의 신으로 삼지창이 상징. 지진을 일으킬 수 있어 '땅을 흔드는 자'라 불렸다. 말을 창조했으며 아테네와 도시의 수호신 자리를 두고 경쟁했다.", shortHint:"삼지창을 들고 바다를 다스리는 신", attributes:"삼지창, 바다, 지진, 말", emoji:"🔱", difficulty:1 },
  { nameKorean:"아테나", nameGreek:"Athena", category:"올림포스 12신", description:"지혜와 전략의 여신. 제우스의 머리에서 완전 무장한 채로 태어났다. 올빼미와 올리브나무가 상징이며, 아테네 도시의 수호신이다.", shortHint:"지혜의 여신, 제우스의 머리에서 탄생", attributes:"올빼미, 올리브나무, 지혜, 투구", emoji:"🦉", difficulty:1 },
  { nameKorean:"아폴론", nameGreek:"Apollo", category:"올림포스 12신", description:"태양, 예언, 음악, 시의 신. 황금 활과 리라가 상징이다. 아르테미스의 쌍둥이 남매이며, 델포이의 신탁을 주관한다.", shortHint:"태양과 음악의 신, 아르테미스의 쌍둥이", attributes:"태양, 활, 리라, 예언, 월계관", emoji:"☀️", difficulty:1 },
  { nameKorean:"아르테미스", nameGreek:"Artemis", category:"올림포스 12신", description:"달과 사냥의 여신. 은빛 활과 달이 상징이며, 순결의 여신이기도 하다. 아폴론의 쌍둥이 누이로, 사냥꾼과 야생동물을 보호한다.", shortHint:"달과 사냥의 여신, 아폴론의 쌍둥이", attributes:"달, 은활, 사냥, 사슴", emoji:"🌙", difficulty:1 },
  { nameKorean:"아프로디테", nameGreek:"Aphrodite", category:"올림포스 12신", description:"사랑과 아름다움의 여신. 바다의 거품에서 태어났으며, 장미와 비둘기가 상징이다. 헤파이스토스의 아내이지만 아레스를 사랑했다.", shortHint:"사랑과 미의 여신, 바다 거품에서 탄생", attributes:"장미, 비둘기, 사랑, 아름다움", emoji:"🌹", difficulty:1 },
  { nameKorean:"아레스", nameGreek:"Ares", category:"올림포스 12신", description:"전쟁의 신으로 폭력적이고 잔인한 전투를 즐긴다. 창과 방패가 상징이며, 독수리와 개가 성스러운 동물이다. 아프로디테와 사랑에 빠졌다.", shortHint:"전쟁의 신, 폭력적인 전투를 즐김", attributes:"창, 방패, 전쟁, 피", emoji:"⚔️", difficulty:2 },
  { nameKorean:"헤파이스토스", nameGreek:"Hephaestus", category:"올림포스 12신", description:"불과 대장장이의 신. 신들의 무기와 갑옷을 만드는 명장. 태어날 때 다리가 불편하여 올림포스에서 버려졌지만, 뛰어난 기술로 신들의 인정을 받았다.", shortHint:"불과 대장장이의 신, 신들의 무기를 제작", attributes:"불, 망치, 대장간, 갑옷", emoji:"🔨", difficulty:2 },
  { nameKorean:"헤르메스", nameGreek:"Hermes", category:"올림포스 12신", description:"신들의 전령이자 상업, 도둑, 여행자의 신. 날개 달린 샌들과 지팡이(케리케이온)가 상징이다. 죽은 자를 저승으로 안내하기도 한다.", shortHint:"날개 달린 샌들을 신은 신들의 전령", attributes:"날개 샌들, 지팡이, 전령, 도둑", emoji:"🪄", difficulty:1 },
  { nameKorean:"데메테르", nameGreek:"Demeter", category:"올림포스 12신", description:"농업과 수확의 여신. 밀 이삭과 낫이 상징이며, 딸 페르세포네가 하데스에게 납치된 후 슬픔으로 대지를 황폐하게 만들었다. 계절의 변화를 만들어낸 신.", shortHint:"농업의 여신, 페르세포네의 어머니", attributes:"밀, 낫, 농업, 수확", emoji:"🌾", difficulty:2 },
  { nameKorean:"디오니소스", nameGreek:"Dionysus", category:"올림포스 12신", description:"포도주와 축제의 신. 포도 넝쿨과 티르소스(지팡이)가 상징이다. 제우스와 인간 세멜레 사이에서 태어난 반신으로, 광기와 환희를 가져다준다.", shortHint:"포도주와 축제의 신", attributes:"포도, 포도주, 티르소스, 축제", emoji:"🍇", difficulty:2 },
  { nameKorean:"하데스", nameGreek:"Hades", category:"기타 신", description:"저승의 신이자 죽은 자들의 왕. 제우스의 형이며, 머리에 쓰면 투명해지는 투구가 상징이다. 페르세포네를 납치하여 아내로 삼았다.", shortHint:"저승을 다스리는 죽음의 신", attributes:"저승, 죽음, 투명 투구, 케르베로스", emoji:"💀", difficulty:1 },
  { nameKorean:"페르세포네", nameGreek:"Persephone", category:"기타 신", description:"데메테르의 딸이자 하데스의 아내. 하데스에게 납치되어 저승의 여왕이 됐다. 석류를 먹어 1년의 절반은 저승에서, 절반은 지상에서 지낸다.", shortHint:"저승의 여왕, 데메테르의 딸", attributes:"석류, 꽃, 저승, 봄", emoji:"🌺", difficulty:2 },
  { nameKorean:"에로스", nameGreek:"Eros", category:"기타 신", description:"사랑의 신이자 아프로디테의 아들. 황금 화살을 맞으면 사랑에 빠지고, 납 화살을 맞으면 사랑을 거부한다. 프시케와의 사랑 이야기로 유명하다.", shortHint:"사랑의 화살을 쏘는 날개 달린 신", attributes:"화살, 활, 날개, 사랑", emoji:"💘", difficulty:2 },
  { nameKorean:"니케", nameGreek:"Nike", category:"기타 신", description:"승리의 여신. 날개가 있으며 월계관과 야자수 가지를 들고 있다. 제우스와 아테나의 전령으로, 전쟁에서의 승리를 가져다준다.", shortHint:"승리의 여신, 날개를 가진 존재", attributes:"날개, 월계관, 승리, 트로피", emoji:"🏆", difficulty:2 },
  { nameKorean:"히프노스", nameGreek:"Hypnos", category:"기타 신", description:"잠의 신. 타나토스(죽음의 신)의 쌍둥이 형제. 양귀비꽃과 날개가 상징이며, 신들과 인간 모두를 잠재울 수 있는 능력을 가졌다.", shortHint:"잠을 가져다주는 신", attributes:"잠, 양귀비, 날개, 밤", emoji:"😴", difficulty:3 },
  { nameKorean:"헤라클레스", nameGreek:"Heracles", category:"영웅", description:"그리스 최고의 영웅. 제우스와 알크메네의 아들로, 12가지 과업을 완수한 것으로 유명하다. 사자 가죽을 걸치고 곤봉을 무기로 사용했다.", shortHint:"12가지 과업을 완수한 최강의 영웅", attributes:"사자 가죽, 곤봉, 괴력, 12과업", emoji:"💪", difficulty:1 },
  { nameKorean:"페르세우스", nameGreek:"Perseus", category:"영웅", description:"제우스와 다나에의 아들. 메두사의 머리를 베고 안드로메다를 구한 영웅. 날개 달린 신발과 투명 투구, 메두사의 머리가 담긴 가방을 가졌다.", shortHint:"메두사를 처치하고 안드로메다를 구한 영웅", attributes:"메두사, 날개 신발, 방패, 별자리", emoji:"🛡️", difficulty:1 },
  { nameKorean:"테세우스", nameGreek:"Theseus", category:"영웅", description:"아테네의 영웅으로 미노타우로스를 물리쳤다. 아리아드네의 실타래 덕분에 미로에서 탈출했다. 아테네의 건국 영웅으로 존경받는다.", shortHint:"미노타우로스를 처치한 아테네의 영웅", attributes:"미로, 실타래, 아테네, 검", emoji:"🗡️", difficulty:2 },
  { nameKorean:"오디세우스", nameGreek:"Odysseus", category:"영웅", description:"이타카의 왕. 트로이 전쟁에서 트로이 목마를 고안한 지략가. 전쟁 후 고향으로 돌아오는 10년의 여정이 '오디세이아'에 기록됐다.", shortHint:"트로이 목마를 고안한 지략의 영웅", attributes:"트로이 목마, 지략, 활, 바다", emoji:"🐴", difficulty:2 },
  { nameKorean:"아킬레우스", nameGreek:"Achilles", category:"영웅", description:"트로이 전쟁 최고의 전사. 어머니 테티스가 스틱스 강에 담가 무적이 되었지만, 발꿈치만 약점이었다. 파리스의 화살에 발꿈치를 맞아 사망했다.", shortHint:"발꿈치가 유일한 약점인 트로이 전쟁의 영웅", attributes:"발꿈치, 갑옷, 창, 분노", emoji:"⚡", difficulty:2 },
  { nameKorean:"이아손", nameGreek:"Jason", category:"영웅", description:"아르고 원정대의 대장으로 황금 양털을 찾아 여정을 떠났다. 마법사 메데이아의 도움으로 과업을 완수했다. 아르고나우타이 이야기의 주인공.", shortHint:"황금 양털을 찾아 아르고 원정대를 이끈 영웅", attributes:"황금 양털, 아르고호, 메데이아", emoji:"⚓", difficulty:3 },
  { nameKorean:"오르페우스", nameGreek:"Orpheus", category:"영웅", description:"음악의 천재로, 리라 연주로 신들과 자연까지 감동시켰다. 아내 에우리디케를 저승에서 구하러 갔지만 뒤를 돌아보는 바람에 실패했다.", shortHint:"음악으로 저승까지 내려간 음악가", attributes:"리라, 음악, 저승, 사랑", emoji:"🎵", difficulty:3 },
  { nameKorean:"메두사", nameGreek:"Medusa", category:"괴물", description:"뱀 머리카락을 가진 고르곤 세 자매 중 하나. 눈을 마주치면 돌로 변한다. 포세이돈의 애인이었으나 아테나의 저주로 괴물이 됐다. 페르세우스에게 처치됐다.", shortHint:"눈을 마주치면 돌이 되는 뱀 머리카락 괴물", attributes:"뱀 머리카락, 돌, 고르곤, 날개", emoji:"🐍", difficulty:1 },
  { nameKorean:"미노타우로스", nameGreek:"Minotaur", category:"괴물", description:"크레타 섬의 미로에 사는 반인반우(半人半牛) 괴물. 크레타 왕 미노스의 아내 파시파에가 낳았다. 매년 아테네에서 바치는 공물을 먹었다가 테세우스에게 처치됐다.", shortHint:"미로에 사는 반인반우 괴물", attributes:"황소 머리, 미로, 크레타, 공물", emoji:"🐂", difficulty:2 },
  { nameKorean:"키클로페스", nameGreek:"Cyclops", category:"괴물", description:"이마 한가운데 눈이 하나 있는 거인족. 대장장이로 제우스의 번개를 만들었다. 오디세우스가 폴리페모스라는 키클로페스의 동굴에 갇혔다가 탈출한 이야기가 유명하다.", shortHint:"눈이 하나인 거인 대장장이", attributes:"외눈, 거인, 대장간, 동굴", emoji:"👁️", difficulty:2 },
  { nameKorean:"케르베로스", nameGreek:"Cerberus", category:"괴물", description:"저승의 입구를 지키는 세 머리 달린 개. 하데스의 파수꾼으로, 산 자는 저승에 들어오지 못하고 죽은 자는 다시 나오지 못하게 막는다.", shortHint:"저승의 입구를 지키는 세 머리 개", attributes:"세 머리, 개, 저승, 파수꾼", emoji:"🐕", difficulty:2 },
  { nameKorean:"히드라", nameGreek:"Hydra", category:"괴물", description:"레르나 늪에 사는 물뱀 괴물. 머리가 여러 개 달렸으며, 머리를 자르면 두 개가 자라난다. 헤라클레스의 12과업 중 하나로 처치됐다.", shortHint:"머리를 자르면 다시 자라는 다두 물뱀", attributes:"다두, 물뱀, 독, 레르나", emoji:"🐲", difficulty:2 },
  { nameKorean:"스핑크스", nameGreek:"Sphinx", category:"괴물", description:"사자의 몸통에 인간 여성의 머리를 가진 괴물. 테베 앞에서 수수께끼를 내어 맞추지 못하면 잡아먹었다. 오이디푸스가 수수께끼를 풀자 스스로 죽었다.", shortHint:"수수께끼를 내는 사자 몸통의 괴물", attributes:"수수께끼, 사자 몸, 여성 머리, 테베", emoji:"🦁", difficulty:3 },
  { nameKorean:"프로메테우스", nameGreek:"Prometheus", category:"티탄", description:"티탄 신족으로 인류의 은인. 신들의 불을 훔쳐 인간에게 주었다. 이 죄로 코카서스 산에 묶여 독수리에게 매일 간을 쪼아 먹히는 형벌을 받았다.", shortHint:"인간에게 불을 가져다준 티탄", attributes:"불, 독수리, 형벌, 인류", emoji:"🔥", difficulty:1 },
  { nameKorean:"크로노스", nameGreek:"Cronos", category:"티탄", description:"티탄의 왕이자 제우스의 아버지. 자식에게 왕위를 빼앗길 것이라는 예언을 들어 자신의 자녀들을 모두 삼켰다. 결국 제우스에게 타르타로스에 갇혔다.", shortHint:"자식을 삼킨 티탄의 왕", attributes:"낫, 시간, 티탄, 왕", emoji:"⏰", difficulty:2 },
  { nameKorean:"아틀라스", nameGreek:"Atlas", category:"티탄", description:"티탄 전쟁에서 패한 뒤 영원히 하늘을 떠받치는 형벌을 받은 티탄. 헤라클레스가 황금 사과를 가져오는 대가로 잠시 하늘을 대신 떠받쳤다.", shortHint:"영원히 하늘을 떠받치는 티탄", attributes:"하늘, 형벌, 티탄, 힘", emoji:"🌍", difficulty:2 },
  { nameKorean:"판도라", nameGreek:"Pandora", category:"인간", description:"신들이 만든 최초의 인간 여성. 절대 열어서는 안 되는 상자를 가지고 있었지만 호기심을 참지 못해 열어 온갖 재앙을 세상에 풀었다. 마지막으로 희망만 남았다.", shortHint:"호기심으로 상자를 열어 재앙을 풀어낸 여성", attributes:"상자, 호기심, 재앙, 희망", emoji:"📦", difficulty:1 },
  { nameKorean:"이카로스", nameGreek:"Icarus", category:"인간", description:"대장장이 다이달로스의 아들. 밀랍으로 만든 날개로 탈출했지만, 아버지의 경고를 무시하고 태양에 너무 가까이 날다가 날개가 녹아 바다에 빠져 죽었다.", shortHint:"날개가 녹아 바다에 떨어진 소년", attributes:"날개, 밀랍, 태양, 추락", emoji:"🪶", difficulty:2 },
  { nameKorean:"나르키소스", nameGreek:"Narcissus", category:"인간", description:"아름다운 청년으로, 물에 비친 자신의 모습에 빠져 결국 죽어 수선화가 됐다. 님프 에코가 사랑을 고백했으나 거절당해 메아리로 변했다.", shortHint:"자신의 모습에 반해 수선화가 된 미소년", attributes:"물, 수선화, 에코, 자기애", emoji:"🌼", difficulty:3 },
  { nameKorean:"미다스", nameGreek:"Midas", category:"인간", description:"손대는 것이 모두 황금으로 변하는 황금의 손을 소원으로 받은 왕. 음식도 딸도 황금이 되자 이를 후회하고 소원을 취소해 달라 빌었다.", shortHint:"황금 손을 가져 모든 것을 황금으로 만든 왕", attributes:"황금, 손, 욕심, 후회", emoji:"✨", difficulty:2 }
];

const CATEGORIES = ["전체","올림포스 12신","기타 신","영웅","괴물","티탄","인간"];
const TOTAL = CHARACTERS.length;

// ===== STATE =====
let unlockedSet = new Set(JSON.parse(localStorage.getItem('unlocked') || '[]'));
let currentScreen = 'home';
let detailBackScreen = 'search';

// Quiz state
let quizQuestions = [];
let currentQIdx = 0;
let score = 0;
let correct = 0;
let timerInterval = null;
let timeLeft = 20;
let answered = false;
let difficultyMode = 'normal';
let bonusPoints = 10;

// Search state
let selectedCat = '전체';

// ===== NAV =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  currentScreen = id;
}
function showHome() { showScreen('home'); }
function showDifficulty() { showScreen('difficulty'); }
function showSearch() { renderSearch(); showScreen('search'); }
function showGallery() { renderGallery(); showScreen('gallery'); }
function showDetail(char, from) {
  detailBackScreen = from;
  document.getElementById('detail-back').onclick = () => showScreen(from);
  document.getElementById('d-emoji').textContent = char.emoji;
  document.getElementById('d-korean').textContent = char.nameKorean;
  document.getElementById('d-greek').textContent = char.nameGreek;
  document.getElementById('d-cat').textContent = char.category;
  document.getElementById('d-desc').textContent = char.description;
  const attrs = document.getElementById('d-attrs');
  attrs.innerHTML = char.attributes.split(',').map(a => `<span class="attr-chip">${a.trim()}</span>`).join('');
  document.getElementById('d-diff').textContent = '⭐'.repeat(char.difficulty) + '☆'.repeat(3 - char.difficulty);
  showScreen('detail');
}

// ===== SEARCH =====
function renderSearch() {
  const chipWrap = document.getElementById('cat-chips');
  chipWrap.innerHTML = CATEGORIES.map(c =>
    `<div class="chip ${c === selectedCat ? 'active' : ''}" onclick="selectCat('${c}')">${c}</div>`
  ).join('');
  filterChars();
}
function selectCat(cat) {
  selectedCat = cat;
  renderSearch();
}
function filterChars() {
  const q = document.getElementById('search-input').value.toLowerCase();
  let list = CHARACTERS.filter(c => {
    const matchCat = selectedCat === '전체' || c.category === selectedCat;
    const matchQ = !q || c.nameKorean.toLowerCase().includes(q) || c.nameGreek.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  document.getElementById('search-count').textContent = `검색 결과: ${list.length}명`;
  const grid = document.getElementById('search-grid');
  if (list.length === 0) {
    grid.innerHTML = '<div class="empty-msg" style="grid-column:1/-1">검색 결과가 없어요 😔</div>';
  } else {
    grid.innerHTML = list.map(c => `
      <div class="char-card" onclick='openDetail(${JSON.stringify(c)}, "search")'>
        <span class="char-emoji">${c.emoji}</span>
        <div class="char-name">${c.nameKorean}</div>
        <div class="char-greek">${c.nameGreek}</div>
        <span class="char-cat">${c.category}</span>
      </div>
    `).join('');
  }
}
function openDetail(char, from) { showDetail(char, from); }

// ===== GALLERY =====
function renderGallery() {
  const unlocked = CHARACTERS.filter(c => unlockedSet.has(c.nameKorean)).length;
  document.getElementById('gal-label').textContent = `해금 ${unlocked} / ${TOTAL}`;
  document.getElementById('gal-bar').style.width = `${(unlocked/TOTAL)*100}%`;
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = CHARACTERS.map(c => {
    const isUnlocked = unlockedSet.has(c.nameKorean);
    return `<div class="gallery-card ${isUnlocked ? '' : 'locked'}" onclick="${isUnlocked ? `openDetail(${JSON.stringify(c)}, 'gallery')` : ''}">
      ${!isUnlocked ? '<span class="lock-overlay">🔒</span>' : ''}
      <div class="gallery-emoji">${c.emoji}</div>
      <div class="gallery-name">${c.nameKorean}</div>
    </div>`;
  }).join('');
}

// ===== QUIZ =====
function startQuiz(diff) {
  difficultyMode = diff;
  bonusPoints = diff === 'easy' ? 5 : diff === 'normal' ? 10 : 15;
  let pool;
  if (diff === 'easy') pool = CHARACTERS.filter(c => c.category === '올림포스 12신');
  else if (diff === 'hard') pool = CHARACTERS.filter(c => c.difficulty >= 2);
  else pool = [...CHARACTERS];
  quizQuestions = generateQuestions(pool, 10);
  currentQIdx = 0; score = 0; correct = 0;
  showScreen('quiz');
  renderQuestion();
}

function generateQuestions(pool, count) {
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(count, shuffled.length));
  return selected.map(char => {
    const others = CHARACTERS.filter(c => c.nameKorean !== char.nameKorean)
      .sort(() => Math.random() - 0.5).slice(0, 3).map(c => c.nameKorean);
    const options = [...others, char.nameKorean].sort(() => Math.random() - 0.5);
    return { char, options, correct: char.nameKorean };
  });
}

function renderQuestion() {
  if (currentQIdx >= quizQuestions.length) { showResult(); return; }
  clearInterval(timerInterval);
  answered = false;
  timeLeft = 20;
  const q = quizQuestions[currentQIdx];
  document.getElementById('q-progress').textContent = `${currentQIdx+1} / ${quizQuestions.length}`;
  document.getElementById('q-bar').style.width = `${((currentQIdx+1)/quizQuestions.length)*100}%`;
  document.getElementById('q-emoji').textContent = q.char.emoji;
  document.getElementById('q-text').textContent = q.char.shortHint;
  document.getElementById('q-score').textContent = `점수: ${score}`;
  renderTimer();
  renderOptions(q);
  startTimer(q);
}

function renderTimer() {
  const el = document.getElementById('timer');
  el.textContent = timeLeft;
  el.classList.toggle('warn', timeLeft <= 5);
}

function startTimer(q) {
  timerInterval = setInterval(() => {
    timeLeft--;
    renderTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) timeOut(q);
    }
  }, 1000);
}

function renderOptions(q) {
  const grid = document.getElementById('options');
  grid.innerHTML = q.options.map(opt => `
    <button class="option-btn" onclick="selectAnswer('${opt}', this)">${opt}</button>
  `).join('');
}

function selectAnswer(chosen, btn) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  const q = quizQuestions[currentQIdx];
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => { b.disabled = true; });
  if (chosen === q.correct) {
    btn.classList.add('correct');
    score += 10 + bonusPoints;
    correct++;
    unlockedSet.add(q.char.nameKorean);
    saveUnlocked();
    playCorrectSound();
  } else {
    btn.classList.add('wrong');
    btn.classList.add('shake');
    allBtns.forEach(b => { if (b.textContent === q.correct) b.classList.add('reveal'); });
    playWrongSound();
  }
  setTimeout(() => { currentQIdx++; renderQuestion(); }, 1400);
}

function timeOut(q) {
  answered = true;
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correct) b.classList.add('reveal');
  });
  setTimeout(() => { currentQIdx++; renderQuestion(); }, 1400);
}

// ===== RESULT =====
function showResult() {
  const total = quizQuestions.length;
  const pct = Math.round((correct / total) * 100);
  let grade, msg;
  if (pct >= 90) { grade = 'S'; msg = '🏆 완벽해요! 신화 마스터!'; }
  else if (pct >= 80) { grade = 'A'; msg = '⭐ 훌륭해요! 신화 박사!'; }
  else if (pct >= 70) { grade = 'B'; msg = '👍 잘했어요! 신화 탐험가!'; }
  else if (pct >= 60) { grade = 'C'; msg = '😊 좋아요! 계속 도전해봐요!'; }
  else if (pct >= 40) { grade = 'D'; msg = '💪 조금 더 공부해봐요!'; }
  else { grade = 'F'; msg = '📚 처음부터 배워봐요!'; }
  document.getElementById('r-grade').textContent = grade;
  document.getElementById('r-msg').textContent = msg;
  document.getElementById('r-score').textContent = score + '점';
  document.getElementById('r-correct').textContent = `${correct} / ${total}`;
  document.getElementById('r-pct').textContent = pct + '%';
  showScreen('result');
  if (pct >= 70) launchConfetti();
}

function launchConfetti() {
  const wrap = document.getElementById('confetti');
  wrap.innerHTML = '';
  const emojis = ['🎉','⭐','✨','🏆','🌟','💫','🎊','🎈'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay = Math.random() * 1.5 + 's';
    wrap.appendChild(el);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 4000);
}

// ===== PERSIST =====
function saveUnlocked() {
  localStorage.setItem('unlocked', JSON.stringify([...unlockedSet]));
}

// ===== INIT chips =====
renderSearch();


// ============================================================
//  BGM  - Web Audio API 기반 그리스 신화 분위기 음악
//  A 도리안 스케일 (A, B, C, D, E, F#, G)
//  계층: 드론 베이스 + 리라 아르페지오 + 패드 화음 + 멜로디
// ============================================================
let audioCtx = null;
let bgmPlaying = false;
let bgmNodes = [];      // 정지 시 disconnect 용
let bgmScheduler = null;

// 음표 주파수 (A 도리안 스케일, 2옥타브)
const SCALE = {
  A2: 110.00, B2: 123.47, C3: 130.81, D3: 146.83, E3: 164.81, Fs3: 185.00, G3: 196.00,
  A3: 220.00, B3: 246.94, C4: 261.63, D4: 293.66, E4: 329.63, Fs4: 369.99, G4: 392.00,
  A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.26
};

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// 마스터 게인 (볼륨 조절 지점)
let masterGain = null;

function initMaster() {
  const ctx = getCtx();
  masterGain = ctx.createGain();
  masterGain.gain.setValueAtTime(0, ctx.currentTime);
  masterGain.connect(ctx.destination);
}

// ── 리버브 (컨볼루션) ──────────────────────────────────────
function createReverb(ctx, duration = 2.5, decay = 2.0) {
  const rate = ctx.sampleRate;
  const len  = rate * duration;
  const ir   = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  const conv = ctx.createConvolver();
  conv.buffer = ir;
  return conv;
}

// ── 리라 (하프) 발현음 ─────────────────────────────────────
function pluckNote(ctx, dest, freq, startTime, duration = 1.2, vol = 0.18) {
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, startTime);

  // 고음 하모닉 블렌드
  const osc2  = ctx.createOscillator();
  const gain2 = ctx.createGain();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(freq * 2, startTime);
  gain2.gain.setValueAtTime(vol * 0.3, startTime);
  gain2.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 0.6);
  osc2.connect(gain2); gain2.connect(dest);
  osc2.start(startTime); osc2.stop(startTime + duration);

  gain.gain.setValueAtTime(vol, startTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain); gain.connect(dest);
  osc.start(startTime); osc.stop(startTime + duration + 0.05);
  bgmNodes.push(osc, osc2);
}

// ── 패드 (지속음) ──────────────────────────────────────────
function padNote(ctx, dest, freq, startTime, dur, vol = 0.06) {
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq, startTime);

  // 부드러운 필터
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(600, startTime);
  filt.Q.value = 0.8;

  const attack = 0.6, release = 1.0;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(vol, startTime + attack);
  gain.gain.setValueAtTime(vol, startTime + dur - release);
  gain.gain.linearRampToValueAtTime(0, startTime + dur);

  osc.connect(filt); filt.connect(gain); gain.connect(dest);
  osc.start(startTime); osc.stop(startTime + dur + 0.1);
  bgmNodes.push(osc);
}

// ── 드론 베이스 ────────────────────────────────────────────
function droneNote(ctx, dest, freq, startTime, dur, vol = 0.07) {
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(vol, startTime);
  gain.gain.setValueAtTime(vol, startTime + dur - 0.5);
  gain.gain.linearRampToValueAtTime(0, startTime + dur);
  osc.connect(gain); gain.connect(dest);
  osc.start(startTime); osc.stop(startTime + dur + 0.05);
  bgmNodes.push(osc);
}

// ── 멜로디 ─────────────────────────────────────────────────
function melodyNote(ctx, dest, freq, startTime, dur, vol = 0.12) {
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  const atk = 0.04;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(vol, startTime + atk);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
  osc.connect(gain); gain.connect(dest);
  osc.start(startTime); osc.stop(startTime + dur + 0.05);
  bgmNodes.push(osc);
}

// ── 한 사이클(8박, ~8초) 스케줄 ───────────────────────────
// BPM 60 → 1박 = 1.0초
const BPM = 58;
const BEAT = 60 / BPM;   // ~1.034 s

function scheduleCycle(ctx, dest, startTime) {
  const b = BEAT;

  // 아르페지오 패턴 (리라 스타일)
  // Am → G → F → Em → Am (2박씩)
  const arpeggios = [
    // Am  (A C E)
    [SCALE.A3, SCALE.C4, SCALE.E4, SCALE.A4],
    // G   (G B D)
    [SCALE.G3, SCALE.B3, SCALE.D4, SCALE.G4],
    // Dm  (D F A)  ← F 도리안에선 F#이지만 Dm 느낌
    [SCALE.D4, SCALE.Fs4, SCALE.A4, SCALE.D5],
    // Em  (E G B)
    [SCALE.E3, SCALE.G3, SCALE.B3, SCALE.E4],
    // Am 반복
    [SCALE.A3, SCALE.E4, SCALE.A4, SCALE.C5],
    // G
    [SCALE.G3, SCALE.D4, SCALE.G4, SCALE.B4],
    // Am 확장
    [SCALE.A2, SCALE.E3, SCALE.A3, SCALE.C4],
    // Em 클로즈
    [SCALE.E3, SCALE.B3, SCALE.E4, SCALE.B4],
  ];

  for (let chord = 0; chord < 8; chord++) {
    const chordStart = startTime + chord * 2 * b;
    const notes = arpeggios[chord];
    // 각 코드당 4음, 0.5박 간격
    notes.forEach((freq, i) => {
      pluckNote(ctx, dest, freq, chordStart + i * 0.5 * b, 1.8 * b, 0.15);
    });

    // 패드 화음 (2박짜리)
    const padRoot = notes[0] * 0.5;
    padNote(ctx, dest, padRoot,   chordStart, 2.2 * b, 0.055);
    padNote(ctx, dest, notes[1],  chordStart, 2.2 * b, 0.04);
    padNote(ctx, dest, notes[2],  chordStart, 2.2 * b, 0.035);

    // 드론 베이스 (A 지속)
    droneNote(ctx, dest, SCALE.A2, chordStart, 2.2 * b, 0.06);
  }

  // 멜로디 라인 (16박 걸쳐 한 번)
  const melSeq = [
    { f: SCALE.E4,  t: 0,    d: 1.5 * b },
    { f: SCALE.D4,  t: 1.5,  d: 0.5 * b },
    { f: SCALE.E4,  t: 2,    d: 1.0 * b },
    { f: SCALE.A4,  t: 3,    d: 2.0 * b },
    { f: SCALE.G4,  t: 5,    d: 1.0 * b },
    { f: SCALE.Fs4, t: 6,    d: 0.5 * b },
    { f: SCALE.E4,  t: 6.5,  d: 1.5 * b },
    { f: SCALE.D4,  t: 8,    d: 1.0 * b },
    { f: SCALE.C4,  t: 9,    d: 0.5 * b },
    { f: SCALE.D4,  t: 9.5,  d: 1.0 * b },
    { f: SCALE.E4,  t: 10.5, d: 2.0 * b },
    { f: SCALE.A3,  t: 12.5, d: 3.0 * b },
  ];
  melSeq.forEach(n => {
    melodyNote(ctx, dest, n.f, startTime + n.t * b, n.d, 0.11);
  });

  return startTime + 16 * b;  // 다음 사이클 시작 시간
}

// ── BGM 루프 스케줄러 ──────────────────────────────────────
let nextCycleTime = 0;
let loopHandle = null;

function schedulerTick() {
  if (!bgmPlaying) return;
  const ctx = getCtx();
  const lookahead = 0.1;
  if (nextCycleTime < ctx.currentTime + lookahead) {
    nextCycleTime = scheduleCycle(ctx, masterGain, Math.max(nextCycleTime, ctx.currentTime + 0.05));
  }
  loopHandle = setTimeout(schedulerTick, 50);
}

// ── 공개 API ───────────────────────────────────────────────
function startBGM() {
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();
  if (!masterGain) initMaster();

  bgmPlaying = true;
  nextCycleTime = ctx.currentTime + 0.1;

  // 페이드인
  masterGain.gain.cancelScheduledValues(ctx.currentTime);
  masterGain.gain.setValueAtTime(0, ctx.currentTime);
  masterGain.gain.linearRampToValueAtTime(1.0, ctx.currentTime + 2.0);

  schedulerTick();
  updateBGMButton(true);
}

function stopBGM() {
  bgmPlaying = false;
  if (loopHandle) clearTimeout(loopHandle);

  const ctx = getCtx();
  if (masterGain) {
    masterGain.gain.cancelScheduledValues(ctx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.5);
  }

  // 기존 노드 예약 취소는 자연 만료에 맡김
  bgmNodes = [];
  updateBGMButton(false);
}

function toggleBGM() {
  if (bgmPlaying) {
    stopBGM();
  } else {
    startBGM();
  }
}

function updateBGMButton(playing) {
  const btn = document.getElementById('bgm-btn');
  btn.className = playing ? 'playing' : '';
  btn.innerHTML = playing
    ? '<span class="note-icon">🎵</span>'
    : '<span>🔇</span>';
  btn.title = playing ? '배경음악 끄기' : '배경음악 켜기';
}

// ── 효과음 ─────────────────────────────────────────────────
function playCorrectSound() {
  try {
    const ctx = getCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const out = masterGain || ctx.destination;
    // 상승 팡파레
    [[SCALE.E4, 0], [SCALE.G4, 0.12], [SCALE.A4, 0.24], [SCALE.E5, 0.38]].forEach(([f, t]) => {
      pluckNote(ctx, out, f, ctx.currentTime + t, 0.6, 0.2);
    });
  } catch(e) {}
}

function playWrongSound() {
  try {
    const ctx = getCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const out = masterGain || ctx.destination;
    // 하강 불협화음
    [[SCALE.C4, 0], [SCALE.B2, 0.1]].forEach(([f, t]) => {
      pluckNote(ctx, out, f, ctx.currentTime + t, 0.5, 0.15);
    });
  } catch(e) {}
}

// 첫 클릭 시 BGM 자동 시작 (브라우저 정책 대응)
let bgmAutoStarted = false;
document.addEventListener('click', () => {
  if (!bgmAutoStarted) {
    bgmAutoStarted = true;
    startBGM();
  }
}, { once: true });
</script>
